server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    include /etc/nginx/snippets/security_headers.conf;

    # Healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }

    # Hashed static assets — immutable cache + security headers
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML entrypoint — always revalidate + security headers
    location = /index.html {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
